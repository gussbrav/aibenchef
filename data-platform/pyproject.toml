[project]
name = "aibenchef-data-platform"
version = "0.1.0"
description = "Aibenchef data platform — scrapers, parsers, dbt orchestration"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.49.0",
    "httpx>=0.28.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.1",                      # .xls legacy format SBS
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.0",
    "boto3>=1.35.0",                    # S3-compat para R2
    "dbt-postgres>=1.9.0",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
    "tqdm>=4.67.0",
    "click>=8.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
    "mypy>=1.14.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
