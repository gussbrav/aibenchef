[project]
name = "aibenchef-data-platform"
version = "0.1.0"
description = "Aibenchef data platform — SBS scrapers, parsers, loaders, dbt orchestration"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.49.0",
    "httpx>=0.28.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.1",
    "pyxlsb>=1.0.10",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
    "boto3>=1.35.0",
    "dbt-postgres>=1.9.0",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
    "tqdm>=4.67.0",
    "click>=8.1.0",
    "python-dateutil>=2.9.0",
]

[project.scripts]
aibenchef = "aibenchef_data.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aibenchef_data"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.8.0",
    "mypy>=1.14.0",
    "ipython>=8.30.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]
extend-exclude = [".venv", "local-data"]

[tool.ruff.lint]
# Reglas core. Empezamos pragmaticos; vamos endureciendo en futuras iteraciones.
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes (imports unused, undefined names)
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line too long (formatter se encarga)
    "B008",  # function call in default arg (click usa esto)
    "RUF012", # mutable class attributes (innecesario aqui)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011", "F401"]
"src/aibenchef_data/cli.py" = ["B008"]  # click.option en defaults

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
