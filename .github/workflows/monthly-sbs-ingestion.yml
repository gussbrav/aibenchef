name: Monthly SBS ingestion

# Corre el dia 15 de cada mes a las 06:00 UTC = 01:00 Peru.
# La SBS publica el cierre del mes anterior tipicamente entre dias 30-45,
# asi que el dia 15 es seguro para datos del mes anterior.
on:
  schedule:
    - cron: "0 6 15 * *"
  workflow_dispatch:
    inputs:
      periodo:
        description: "Periodo YYYYMM a procesar (vacio = mes anterior)"
        required: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: data-platform
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv python install 3.12
      - run: uv sync --frozen

      - name: Scrape SBS
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
          PERIODO: ${{ github.event.inputs.periodo }}
        run: uv run aibenchef scrape --periodo "${PERIODO:-}"

      - name: Storage scan -> raw.archivos_descargados
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
        run: uv run aibenchef storage scan

      - name: Import .xls mensuales -> raw.eeff_observacion
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
        run: uv run aibenchef import monthly-eeff ./local-data/raw

      - name: Normalize entidades
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
        run: uv run aibenchef catalog normalize-entidades

      - name: Refresh MVs marts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
        run: uv run aibenchef db refresh-mvs --concurrently

      # dbt esta deshabilitado hasta que se reconcilien los sources (ver
      # docs/audits/04-transformacion.md). El unico modelo apunta a raw.eeff
      # que no existe; la tabla real es raw.eeff_observacion. Mientras tanto
      # las MVs se mantienen por SQL via aibenchef db refresh-mvs.
      # - name: dbt run + test
      #   env:
      #     DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
      #   run: |
      #     uv run dbt run --project-dir dbt --profiles-dir dbt
      #     uv run dbt test --project-dir dbt --profiles-dir dbt

      - name: Notify Slack on failure
        if: failure()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_INGESTION }}
          SLACK_COLOR: danger
          SLACK_MESSAGE: "Ingesta SBS fallida para periodo ${{ github.event.inputs.periodo || 'mes anterior' }}"
